    <script>
      /* ac-booting: first paint stays contentful (no opacity:0 enter) so LCP can fire — PulseCap pc-booting pattern. */
      document.documentElement.classList.add('ac-booting');
    </script>
    <style>
      html.ac-booting .glass-card-enter,
      html.ac-booting .animate-fiu,
      html.ac-booting .cap-route-enter { animation: none !important; opacity: 1 !important; transform: none !important; }
      #ac-boot-shell {
        min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 24px; text-align: center; background: #08090d; color: #eef2f6; font-family: system-ui, sans-serif;
      }
      #ac-boot-shell h1 { font-size: clamp(28px, 6vw, 40px); font-weight: 700; letter-spacing: -0.02em; margin: 0 0 12px; }
      #ac-boot-shell p { margin: 0; font-size: 14px; color: rgba(238, 242, 246, 0.48); max-width: 28ch; line-height: 1.5; }
    </style>
  </head>
  <body data-cap-app="1">
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <a href="#main" class="cap-skip-link">Skip to content</a>
    <div id="root">
      <div id="ac-boot-shell" aria-busy="true">
        <h1>AuraCap</h1>
        <p>Organize your iPhone, iPad and Mac setup.</p>
      </div>
    </div>

</body>
