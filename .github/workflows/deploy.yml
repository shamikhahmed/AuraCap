name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # C-31: FINISH_MATRIX=1 required (see capricorn-tooling/shared/testing/FINISH-MATRIX-CI.md).
  finish-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Finish matrix
        env:
          FINISH_MATRIX: "1"
        run: npm run test:matrix
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finish-matrix-shots
          path: qa/finish-loop/shots/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matrix-results
          path: qa/finish-loop/matrix-results.json
          retention-days: 14

  build:
    needs: [test, finish-matrix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate-icons
      - run: npm run build
      # AUR-V3-2: hub live catalog reads /AuraCap/VERSION.json from Pages
      - run: npm run ensure:version
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
